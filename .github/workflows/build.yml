name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包单文件 exe（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install -r requirements-build.txt

      - name: 用 PyInstaller 打包
        run: |
          .venv\Scripts\pyinstaller --noconfirm --onefile --windowed `
            --name "A股模拟交易终端" `
            --hidden-import cnstock `
            --collect-all pyqtgraph `
            --collect-all PyQt6 `
            --collect-all akshare `
            --collect-all tushare `
            launcher.py

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: A股模拟交易终端-exe
          path: dist/A股模拟交易终端.exe
          if-no-files-found: error

      - name: 发布到 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/A股模拟交易终端.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
