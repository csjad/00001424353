name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包单文件 exe（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装应用依赖（供 PyInstaller --collect-all 收包）
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: 本地自检（核心逻辑）
        run: python scripts/_smoke.py

      - name: 本地自检（持久化往返 / 交易视图渲染 / 数据源失败冷却）
        run: python scripts/_verify.py

      - name: 打包 exe（由 build.py 统一处理 PyInstaller 安装 + 清理 + 打包）
        run: python build.py --skip-tests

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: A股模拟交易终端-exe
          path: dist/A股模拟交易终端.exe
          if-no-files-found: error

      - name: 发布到 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/A股模拟交易终端.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
